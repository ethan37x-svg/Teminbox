    <script>
      // Polyfill/Shim to ensure window.fetch is writable and has a setter in iframe / sandboxed environments.
      // This prevents "Cannot set property fetch of #<Window> which has only a getter" when external tools or libraries patch fetch.
      (function() {
        try {
          var _origFetch = window.fetch;
          var _fetchHandler = _origFetch ? _origFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetchHandler;
            },
            set: function(val) {
              _fetchHandler = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var _pFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return _pFetch;
              },
              set: function(val) {
                _pFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err) {}
        }
      })();
    </script>
