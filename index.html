          var _fetchHandler = _origFetch ? _origFetch.bind(window) : undefined;

            get: function() {

          var reason = event && event.reason;

          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (
            typeof msg === 'string' && (
              msg.indexOf('WebSocket') !== -1 ||
              msg.indexOf('websocket') !== -1 ||

              } else if (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) {

                  readyState: 1, // OPEN

                  CLOSED: 3,
                  CLOSING: 2,

                      setTimeout(function() {
                        var evt = { type: 'open', target: dummyWs };

                        callback(evt);
                      }, 0);

                    if (this._listeners['close']) {
                      this._listeners['close'].forEach(function(cb) { cb(evt); });
                    }

            };
